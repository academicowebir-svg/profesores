services:
  - type: web
    name: profesores
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_SSL
        value: "true"
